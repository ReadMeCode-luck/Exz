<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Экзамен: Тестирование ПО (с кодом) — Тёмная тема</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a0f1c;
            font-family: system-ui, -apple-system, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            padding: 16px 12px 30px 12px;
            color: #eef2ff;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .exam-card {
            background: #111827;
            border-radius: 20px;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            border: 1px solid #2d3a4e;
        }

        .header {
            background: #0b1120;
            padding: 16px 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #2d3a4e;
        }

        .title h1 {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(135deg, #FDE68A, #F59E0B);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }

        .title p {
            font-size: 0.7rem;
            opacity: 0.7;
            margin-top: 4px;
        }

        .stats {
            background: #1e2a3e;
            padding: 6px 12px;
            border-radius: 12px;
            font-weight: 600;
            display: flex;
            gap: 12px;
            font-size: 0.75rem;
        }

        .stats span {
            background: #f4c542;
            color: #1e2a3a;
            padding: 2px 8px;
            border-radius: 20px;
            margin-left: 6px;
        }

        .config-popup {
            position: relative;
        }
        .config-toggle {
            background: #1e293b;
            border: 1px solid #3b4a62;
            color: #f4c542;
            padding: 6px 14px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
        }
        .config-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 16px;
            width: 260px;
            z-index: 200;
            box-shadow: 0 12px 28px rgba(0,0,0,0.5);
            display: none;
            flex-direction: column;
            gap: 14px;
            backdrop-filter: blur(4px);
        }
        .config-dropdown.open {
            display: flex;
        }
        .config-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .config-item label {
            font-weight: 500;
            font-size: 0.85rem;
        }
        .config-item input {
            background: #0f172a;
            border: 1px solid #4b5563;
            color: #facc15;
            padding: 8px 10px;
            border-radius: 12px;
            width: 80px;
            text-align: center;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .apply-config {
            background: #f4c542;
            color: #0f172a;
            border: none;
            padding: 10px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 0.85rem;
            margin-top: 4px;
        }

        .progress-area {
            padding: 12px 20px 8px 20px;
            background: #0f172a;
            border-bottom: 1px solid #2d3a4e;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            font-weight: 500;
            margin-bottom: 6px;
        }

        .bar-bg {
            background: #2d3a4e;
            border-radius: 10px;
            height: 6px;
            overflow: hidden;
        }

        .bar-fill {
            background: #f4c542;
            width: 0%;
            height: 100%;
            border-radius: 10px;
            transition: width 0.2s ease;
        }

        .question-nav {
            background: #0f172a;
            padding: 12px 16px;
            border-bottom: 1px solid #2d3a4e;
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
            display: flex;
            gap: 8px;
            scrollbar-width: thin;
            -webkit-overflow-scrolling: touch;
        }
        .question-nav::-webkit-scrollbar {
            height: 3px;
        }
        .nav-rect {
            display: inline-flex;
            min-width: 40px;
            height: 40px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.1s;
            flex-shrink: 0;
        }
        .nav-rect.active-rect {
            background: #f4c542;
            border-color: #facc15;
            box-shadow: 0 0 0 2px rgba(244,197,66,0.4);
        }
        .nav-rect.answered-status {
            border-left: 4px solid #4ade80;
            border-bottom: 2px solid #4ade80;
        }

        .question-area {
            padding: 20px 16px 20px 16px;
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 500;
            line-height: 1.45;
            margin-bottom: 24px;
            background: #111c2e;
            padding: 16px 18px;
            border-radius: 18px;
            border-left: 5px solid #f4c542;
            word-break: break-word;
            white-space: pre-wrap;
            font-family: monospace;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .option-item {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 12px 16px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.12s;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            color: #f1f5f9;
        }

        .option-item:hover:not(.disabled-opt) {
            background: #2d3a4e;
            border-color: #f4c542;
        }

        .prefix {
            font-weight: 800;
            background: #2d3a4e;
            min-width: 32px;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            color: #facc15;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .option-text {
            flex: 1;
            line-height: 1.4;
            white-space: pre-wrap;
        }

        .option-item.correct-highlight {
            background: #14532d;
            border-color: #4ade80;
            pointer-events: none;
        }

        .option-item.wrong-highlight {
            background: #7f1a1a;
            border-color: #f87171;
            pointer-events: none;
        }

        .disabled-opt {
            pointer-events: none;
            opacity: 0.9;
        }

        .feedback {
            background: #1e293b;
            border-radius: 16px;
            padding: 14px 18px;
            margin: 12px 0 18px;
            font-size: 0.9rem;
            border-left: 4px solid #f4c542;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        .next-btn, .reset-exam-btn {
            background: #f4c542;
            color: #0f172a;
            border: none;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 12px 16px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            flex: 1;
            text-align: center;
        }

        .reset-exam-btn {
            background: #334155;
            color: #f1f5f9;
        }
        .reset-exam-btn:active, .next-btn:active {
            transform: scale(0.97);
        }

        .result-panel {
            background: #0f172a;
            padding: 20px 18px;
            border-radius: 24px;
            text-align: center;
            margin: 20px 16px 30px;
            border: 1px solid #f4c542;
        }

        .finish-stats {
            font-size: 1.3rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        footer {
            text-align: center;
            margin-top: 16px;
            font-size: 0.65rem;
            color: #6c757d;
        }

        @media (max-width: 480px) {
            body {
                padding: 12px 10px 24px 10px;
            }
            .header {
                padding: 12px 16px;
            }
            .title h1 {
                font-size: 1.2rem;
            }
            .stats {
                padding: 4px 10px;
                gap: 8px;
            }
            .question-text {
                font-size: 0.95rem;
                padding: 14px 16px;
            }
            .option-item {
                padding: 10px 14px;
                gap: 10px;
            }
            .prefix {
                min-width: 28px;
                height: 28px;
                font-size: 0.8rem;
            }
            .nav-rect {
                min-width: 34px;
                height: 34px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="exam-card">
        <div class="header">
            <div class="title">
                <h1>🐞 Тестирование ПО (pytest + Git)</h1>
                <p>60 вопросов с реальным кодом • Адаптив iPhone</p>
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <div class="stats">
                    <div>📋 <span id="total-count">0</span></div>
                </div>
                <div class="config-popup">
                    <button id="configToggleBtn" class="config-toggle">⚙️</button>
                    <div id="configDropdown" class="config-dropdown">
                        <div class="config-item"><label>🎯 Кол-во вопросов:</label><input type="number" id="total-limit" min="10" max="60" value="30" step="1"></div>
                        <button id="applyConfigBtn" class="apply-config">🎲 Применить</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="progress-area">
            <div class="progress-text">
                <span>📋 Вопрос <span id="current-num">1</span> / <span id="total-questions">60</span></span>
                <span>✅ <span id="correct-counter">0</span></span>
            </div>
            <div class="bar-bg"><div class="bar-fill" id="progress-fill"></div></div>
        </div>

        <div id="nav-buttons-container" class="question-nav"></div>

        <div id="dynamic-content">
            <div class="question-area">
                <div class="question-text" id="question-text">Загрузка...</div>
                <div class="options-list" id="options-container"></div>
                <div id="feedback-area" class="feedback" style="display: none;"></div>
                <div class="action-buttons">
                    <button id="resetButton" class="reset-exam-btn">🔄 Сброс</button>
                    <button id="nextButton" class="next-btn">➡️ Дальше</button>
                </div>
            </div>
        </div>
        <div id="final-results" style="display: none;"></div>
    </div>
    <footer>⚡ Зелёная рамка = отвечен. Код внутри вопросов сохранён полностью.</footer>
</div>

<script>
    // ========= ПОЛНАЯ БАЗА ВОПРОСОВ (60 шт) С КОДОМ И ПРАВИЛЬНЫМИ ОТВЕТАМИ =========
    const fullBank = [
        { text: "1. Почему альфа-тестирование чаще выявляет архитектурные и организационные дефекты, а бета-тестирование — эксплуатационные?", options: ["A) альфа проводится только автоматически, а бета только вручную", "B) альфа проходит в контролируемой среде разработчика, а бета — в условиях реального использования", "C) бета проводится до альфа-тестирования", "D) различий между ними нет"], correct: 1 },
        { text: "2. В каком случае результаты бета-тестирования нельзя считать достаточным основанием для релиза?", options: ["A) если тестирование проводилось реальными пользователями", "B) если тестирование выполнялось вне офиса разработчика", "C) если не были проверены критичные бизнес-сценарии и регрессионные риски", "D) если пользователи оставили мало комментариев"], correct: 2 },
        { text: "3. Почему приёмочное тестирование не заменяет полноценное функциональное тестирование?", options: ["A) потому что приёмочное тестирование проверяет готовность системы для заказчика, но не гарантирует полное покрытие требований", "B) потому что оно выполняется только разработчиками", "C) потому что оно всегда автоматизировано", "D) потому что оно не связано с пользовательскими сценариями"], correct: 0 },
        { text: "4. После исправления дефекта в форме регистрации тестировщик проверил только регистрацию, авторизацию и восстановление пароля. Какой тип тестирования описан?", options: ["A) нагрузочное", "B) санитарное", "C) приёмочное", "D) бета-тестирование"], correct: 1 },
        { text: "5. Почему повторное появление ранее исправленного дефекта часто указывает на проблему тестовой стратегии?", options: ["A) потому что система контроля версий всегда работает некорректно", "B) потому что тестировщик неправильно оформил баг-репорт", "C) потому что отсутствует достаточное регрессионное покрытие затронутой области", "D) потому что дефект нельзя исправить окончательно"], correct: 2 },
        { text: "6. Какой подход используется, если тестировщик проверяет систему только через интерфейс и не знает внутреннюю реализацию?", options: ["A) белый ящик", "B) серый ящик", "C) чёрный ящик", "D) статический анализ"], correct: 2 },
        { text: "7. В каком случае тестирование белого ящика особенно эффективно?", options: ["A) при проверке цвета кнопок", "B) при анализе условий, ветвлений и путей выполнения кода", "C) при проверке пользовательских ожиданий без доступа к коду", "D) при приёмке системы заказчиком"], correct: 1 },
        { text: "8. Почему тестирование только методом чёрного ящика может быть недостаточным?", options: ["A) оно не позволяет анализировать внутренние пути выполнения программы", "B) оно всегда выполняется только вручную", "C) оно не проверяет пользовательские сценарии", "D) оно невозможно без доступа к базе данных"], correct: 0 },
        { text: "9. Тестировщик знает структуру таблиц БД и API, но не имеет доступа ко всему исходному коду. Какой подход применяется?", options: ["A) чёрный ящик", "B) белый ящик", "C) серый ящик", "D) приёмочное тестирование"], correct: 2 },
        { text: "10. Почему регрессионное тестирование важно после изменения уже работающего модуля?", options: ["A) оно проверяет скорость работы системы", "B) оно позволяет выявить побочные эффекты изменений в связанных компонентах", "C) оно заменяет все виды тестирования", "D) оно нужно только перед первым релизом"], correct: 1 },
        { text: "11. Какой тест разумнее всего включить в обязательный регрессионный набор?", options: ["A) тест редко используемой декоративной анимации", "B) тест критичного сценария оплаты заказа", "C) тест одного неиспользуемого поля в админке", "D) тест проверки версии Python"], correct: 1 },
        { text: "12. В чём основная разница между санитарным и регрессионным тестированием?", options: ["A) санитарное глубже регрессионного", "B) санитарное проверяет ограниченную область после небольшого изменения, регрессионное — отсутствие побочных эффектов шире", "C) регрессионное выполняется только вручную", "D) санитарное используется только при нагрузочном тестировании"], correct: 1 },
        { text: "13. Что означает переоткрытие бага?", options: ["A) создание нового дефекта без связи со старым", "B) удаление дефекта из системы отслеживания", "C) повторное проявление дефекта после того, как он был исправлен и закрыт", "D) перенос дефекта в другой проект"], correct: 2 },
        { text: "14. Почему негативное тестирование пользовательского ввода обязательно даже при наличии валидации на клиенте?", options: ["A) клиентская валидация может быть обойдена", "B) клиентская валидация всегда быстрее серверной", "C) негативное тестирование заменяет позитивное", "D) pytest требует негативные тесты"], correct: 0 },
        { text: "15. Что является основной задачей профилирования данных перед тестированием?", options: ["A) автоматическое исправление ошибок в базе данных после миграций от разработчика", "B) анализ структуры, распределения, пропусков и аномалий в данных", "C) запуск всех тестов pytest, с целью убедится, что всё хорошо работает", "D) удаление некорректных записей без анализа"], correct: 1 },
        { text: "16. Почему профилирование данных повышает качество негативного тестирования?", options: ["A) позволяет выявить реальные аномалии и подозрительные значения во входных данных", "B) заменяет тестовые сценарии", "C) исключает необходимость проверки границ", "D) гарантирует отсутствие дефектов"], correct: 0 },
        { text: "17. В существующей базе пользователей обнаружено, что поле age содержит значения -5, 0, 150 и NULL. Какой вывод наиболее полезен для тестировщика?", options: ["A) данные можно использовать без изменений", "B) нужно проектировать тесты на граничные, отсутствующие и некорректные значения", "C) тестирование возраста не требуется", "D) проблема относится только к интерфейсу"], correct: 1 },
        { text: "18. Почему реальные пользовательские данные без профилирования могут быть плохой основой для тестов?", options: ["A) они всегда слишком маленькие", "B) они могут содержать скрытые аномалии, смещения и непредставительные распределения", "C) pytest не умеет работать с реальными данными", "D) реальные данные нельзя использовать ни при каких условиях"], correct: 1 },
        { text: "19. Почему необработанные исключения считаются проблемой качества системы?", options: ["A) они делают поведение системы непредсказуемым для пользователя и тестировщика", "B) они ускоряют завершение программы", "C) они всегда означают ошибку pytest", "D) они относятся только к синтаксису Python"], correct: 0 },
        { text: "20. В каком случае блок finally особенно важен?", options: ["A) когда нужно освободить ресурс независимо от того, возникло исключение или нет", "B) когда нужно заменить assert", "C) когда тест должен быть пропущен", "D) когда функция не возвращает значение"], correct: 0 },
        { text: "21. Что покажет выполнение тестов?\n\nimport pytest\n\nusers = []\n\n@pytest.fixture\ndef user_storage():\n    users.clear()\n    return users\n\ndef register_user(storage, email):\n    if \"@\" not in email:\n        raise ValueError(\"Некорректный email\")\n    storage.append(email)\n    return True\n\ndef test_valid_registration(user_storage):\n    assert register_user(user_storage, \"user@mail.ru\") is True\n    assert user_storage == [\"user@mail.ru\"]\n\ndef test_invalid_registration(user_storage):\n    with pytest.raises(ValueError):\n        register_user(user_storage, \"wrong-email\")\n    assert user_storage == []", options: ["A) первый тест упадёт, второй пройдёт", "B) оба теста упадут", "C) оба теста пройдут успешно", "D) первый тест пройдёт, второй упадёт"], correct: 2 },
        { text: "22. Что является главной проблемой тестового набора?\n\ncart = []\n\ndef add_product(product):\n    cart.append(product)\n\ndef get_total():\n    return sum(item[\"price\"] for item in cart)\n\ndef test_add_phone():\n    add_product({\"name\": \"phone\", \"price\": 50000})\n    assert get_total() == 50000\n\ndef test_add_case():\n    add_product({\"name\": \"case\", \"price\": 1000})\n    assert get_total() == 1000", options: ["A) pytest не умеет тестировать списки", "B) функция get_total не использует return", "C) тесты зависят от общего изменяемого состояния", "D) в тестах нельзя использовать словари"], correct: 2 },
        { text: "23. Какой результат наиболее вероятен при запуске всего файла?\n\nimport pytest\n\n@pytest.fixture(scope=\"module\")\ndef orders():\n    return []\n\ndef create_order(orders, user_id, amount):\n    order = {\"user_id\": user_id, \"amount\": amount}\n    orders.append(order)\n    return order\n\ndef test_create_first_order(orders):\n    create_order(orders, 1, 1500)\n    assert len(orders) == 1\n\ndef test_create_second_order(orders):\n    create_order(orders, 2, 2000)\n    assert len(orders) == 1", options: ["A) тесты не запустятся из-за ошибки синтаксиса", "B) pytest автоматически создаст копию списка для каждого теста", "C) оба теста пройдут, потому что fixture очищается перед каждым тестом", "D) второй тест может упасть, потому что fixture с module scope хранит общий список"], correct: 3 },
        { text: "24. Что проверяет этот тест наиболее корректно?\n\nimport pytest\n\ndef calculate_discount(price, user_type):\n    if price < 0:\n        raise ValueError(\"price cannot be negative\")\n    if user_type == \"vip\":\n        return price * 0.8\n    if user_type == \"regular\":\n        return price * 0.95\n    return price\n\n@pytest.mark.parametrize(\n    \"price,user_type,expected\",\n    [\n        (1000, \"vip\", 800),\n        (1000, \"regular\", 950),\n        (1000, \"guest\", 1000),\n    ]\n)\ndef test_calculate_discount(price, user_type, expected):\n    assert calculate_discount(price, user_type) == expected", options: ["A) только работу fixture", "B) разные бизнес-правила расчёта скидки для типов пользователей", "C) только обработку исключений", "D) только производительность функции"], correct: 1 },
        { text: "25. Рассмотрите функцию\n\ndef calculate_discount(price):\n    if price < 0:\n        raise ValueError(\"negative price\")\n    if price == 0:\n        return 0\n    if price > 100:\n        return price * 0.8\n    return price * 0.9\n\nКакой минимальный набор тестов обеспечивает полное покрытие ветвлений?", options: ["A) price = 10", "B) price = -1, price = 0", "C) price = -1, price = 0, price = 50, price = 150", "D) price = 0.0, price = 100.0"], correct: 2 },
        { text: "26. Что произойдёт при выполнении теста?\n\nimport pytest\n\ndef calculate_discount(price):\n    if price < 0:\n        raise ValueError(\"negative price\")\n    return price * 0.9\n\ndef test_negative_price():\n    with pytest.raises(ValueError):\n        calculate_discount(-100)", options: ["A) тест будет пропущен", "B) функция вернёт -90 и тест пройдёт", "C) тест пройдёт успешно", "D) тест упадёт, потому что исключения нельзя проверять через pytest"], correct: 2 },
        { text: "27. Что является проблемой этого теста?\n\ndef get_user_role(user):\n    if user[\"is_admin\"]:\n        return \"admin\"\n    return \"user\"\n\ndef test_user_role():\n    user = {\"name\": \"Ivan\", \"is_admin\": True}\n    assert get_user_role(user) == \"admin\"", options: ["A) функция не возвращает значение", "B) проверяется только одна ветка логики", "C) pytest не поддерживает словари", "D) тест не содержит assert"], correct: 1 },
        { text: "28. Почему при тестировании функции с условным оператором важно проверять обе ветви выполнения?", options: ["A) потому что pytest требует минимум два теста для каждой функции", "B) потому что разные ветви могут содержать разную логику и разные потенциальные дефекты", "C) потому что условные операторы нельзя тестировать автоматически", "D) потому что один тест всегда проверяет все возможные варианты поведения"], correct: 1 },
        { text: "29. Что произойдёт при выполнении тестов?\n\nimport pytest\n\n@pytest.fixture\ndef user():\n    return {\"balance\": 1000}\n\ndef withdraw(user, amount):\n    if amount > user[\"balance\"]:\n        raise ValueError(\"not enough money\")\n    user[\"balance\"] -= amount\n    return user[\"balance\"]\n\ndef test_success_withdraw(user):\n    assert withdraw(user, 300) == 700\n\ndef test_failed_withdraw(user):\n    with pytest.raises(ValueError):\n        withdraw(user, 1500)\n    assert user[\"balance\"] == 1000", options: ["A) второй тест упадёт из-за изменения баланса в первом тесте", "B) pytest выполнит fixture только один раз на файл", "C) оба теста пройдут, потому что fixture создаёт новый словарь для каждого теста", "D) первый тест упадёт, второй пройдёт"], correct: 2 },
        { text: "30. Как влияет использование fixture с параметром scope=\"module\" на тесты, использующие изменяемые объекты (например список или словарь)?", options: ["A) fixture будет выполняться перед каждой строкой теста", "B) каждый тест получит полностью независимую копию объекта", "C) изменённое состояние объекта может сохраняться между тестами одного модуля", "D) pytest перестанет создавать fixture автоматически"], correct: 2 },
        { text: "31. Что проверяет данный набор параметров?\n\nimport pytest\n\ndef validate_age(age):\n    if not isinstance(age, int):\n        raise TypeError(\"age must be int\")\n    if age < 18 or age > 60:\n        raise ValueError(\"invalid age\")\n    return True\n\n@pytest.mark.parametrize(\"age\", [17, 18, 19, 60, 61])\ndef test_age_boundaries(age):\n    if age in [17, 61]:\n        with pytest.raises(ValueError):\n            validate_age(age)\n    else:\n        assert validate_age(age) is True", options: ["A) только значения внутри допустимого диапазона", "B) только некорректные значения", "C) граничные значения диапазона и выход за его пределы", "D) случайные тестовые данные"], correct: 2 },
        { text: "32. Какой недостаток есть у этого теста?\n\n@pytest.mark.parametrize(\"age\", [17, 18, 19, 60, 61])\ndef test_age_boundaries(age):\n    if age in [17, 61]:\n        with pytest.raises(ValueError):\n            validate_age(age)\n    else:\n        assert validate_age(age) is True", options: ["A) в одном тесте смешаны успешные и ошибочные сценарии", "B) pytest не поддерживает if внутри теста", "C) параметризация не работает с числами", "D) нельзя использовать pytest.raises внутри параметризованного теста"], correct: 0 },
        { text: "33. Какой вариант параметризации лучше с точки зрения читаемости отчёта, сопровождения и разделения тестовых случаев?\n\nA) @pytest.mark.parametrize(\"age\", [17, 18, 19, 60, 61])\n   def test_age_validation(age):\n       assert is_valid_age(age) == (18 <= age <= 60)\n\nB) @pytest.mark.parametrize(\"age,expected\", [(17, False), (18, True), (19, True), (60, True), (61, False)], ids=[\"below_min\",\"min_boundary\",\"inside_range\",\"max_boundary\",\"above_max\"])\n   def test_age_validation(age, expected):\n       assert is_valid_age(age) == expected\n\nC) def test_age_validation():\n       for age in [17, 18, 19, 60, 61]:\n           assert is_valid_age(age) == (18 <= age <= 60)\n\nD) @pytest.mark.parametrize(\"age\", [17, 18, 19, 60, 61])\n   def test_age_validation(age):\n       if age in [17, 61]:\n           assert is_valid_age(age) is False\n       else:\n           assert is_valid_age(age) is True", options: ["A) Вариант A", "B) Вариант B", "C) Вариант C", "D) Вариант D"], correct: 1 },
        { text: "34. Что произойдёт при выполнении теста?\n\ndef normalize_email(email):\n    return email.strip().lower()\n\ndef test_normalize_email():\n    assert normalize_email(\" User@MAIL.RU \") == \"user@mail.ru\"", options: ["A) тест упадёт", "B) возникнет ValueError", "C) pytest не сможет сравнить строки", "D) тест пройдёт успешно"], correct: 3 },
        { text: "35. Какой важный сценарий не проверяет предыдущий тест?", options: ["A) работу метода lower()", "B) сравнение строк", "C) пустую строку или некорректный email", "D) наличие пробелов и верхнего регистра"], correct: 2 },
        { text: "36. Что произойдёт при выполнении теста?\n\ndef get_status_code(response):\n    return response[\"status\"]\n\ndef test_response_status():\n    response = {\"status\": 200, \"body\": {\"ok\": True}}\n    assert get_status_code(response) == 201", options: ["A) тест пройдёт успешно", "B) возникнет KeyError", "C) pytest проигнорирует assert", "D) тест упадёт из-за несовпадения ожидаемого и фактического значения"], correct: 3 },
        { text: "37. Какой тест лучше проверяет обработку отсутствующего поля status?\n\nA) def test_response_without_status():\n       response = {\"status\": 200}\n       assert response[\"status\"] == 200\n\nB) import pytest\n   def test_response_without_status():\n       response = {\"body\": {\"ok\": True}}\n       with pytest.raises(KeyError):\n           get_status_code(response)\n\nC) def test_response_without_status():\n       assert True\n\nD) def test_response_without_status():\n       print(get_status_code)", options: ["A) Вариант A", "B) Вариант B", "C) Вариант C", "D) Вариант D"], correct: 1 },
        { text: "38. Почему использование слишком широких ожидаемых результатов (например, допуска нескольких различных корректных исходов без уточнения контекста) снижает диагностическую ценность теста?", options: ["A) потому что тест становится зависимым от версии Python", "B) потому что усложняется определение причины ошибки при падении теста", "C) потому что pytest не поддерживает множественные ожидаемые значения", "D) потому что такие тесты нельзя автоматизировать"], correct: 1 },
        { text: "39. Какой вариант ожидания лучше для теста создания нового пользователя?", options: ["A) assert True", "B) assert response.status_code in [200, 201, 400, 500]", "C) assert response.status_code == 201", "D) assert response.status_code"], correct: 2 },
        { text: "40. Что проверяет тест?\n\nimport pytest\n\ndef login(user, password):\n    if user == \"admin\" and password == \"12345\":\n        return \"token\"\n    raise PermissionError(\"invalid credentials\")\n\n@pytest.mark.parametrize(\n    \"user,password\",\n    [\n        (\"admin\", \"wrong\"),\n        (\"unknown\", \"12345\"),\n        (\"\", \"\"),\n    ]\n)\ndef test_invalid_login(user, password):\n    with pytest.raises(PermissionError):\n        login(user, password)", options: ["A) негативные сценарии авторизации", "B) только успешную авторизацию", "C) производительность авторизации", "D) работу Git"], correct: 0 },
        { text: "41. Почему несколько декораторов parametrize повышают полноту проверки комбинаций входных данных?", options: ["A) потому что pytest выполняет только последний декоратор", "B) потому что создаётся декартово произведение наборов параметров", "C) потому что тест выполняется один раз", "D) потому что параметры игнорируются"], correct: 1 },
        { text: "42. Сколько тестовых случаев создаст pytest?\n\nimport pytest\n\n@pytest.mark.parametrize(\"role\", [\"admin\", \"user\"])\n@pytest.mark.parametrize(\"active\", [True, False])\n@pytest.mark.parametrize(\"verified\", [True, False])\ndef test_access_matrix(role, active, verified):\n    assert isinstance(role, str)\n    assert isinstance(active, bool)\n    assert isinstance(verified, bool)", options: ["A) 3", "B) 6", "C) 8", "D) 12"], correct: 2 },
        { text: "43. В каком случае использование autouse=True для fixture может ухудшить архитектуру тестового набора?", options: ["A) когда подготовка тестового окружения выполняется неявно и становится трудно определить зависимости между тестами", "B) когда fixture выполняется перед каждым тестом независимо от области применения", "C) когда fixture нельзя использовать совместно с параметризацией тестов", "D) когда fixture невозможно переопределить в отдельных тестовых модулях"], correct: 0 },
        { text: "44. Почему пользовательские маркеры pytest полезны в больших проектах?", options: ["A) они позволяют группировать и запускать тесты по категориям, рискам или типам проверки", "B) они заменяют все fixture", "C) они автоматически исправляют ошибки", "D) они уменьшают количество требований"], correct: 0 },
        { text: "45. В каком случае пользовательские маркеры помогают реализовать риск-ориентированный подход?", options: ["A) когда тесты высокого риска можно запускать отдельно и чаще остальных", "B) когда все тесты всегда запускаются без фильтрации", "C) когда тесты удаляются после каждого релиза", "D) когда pytest запускается без конфигурации"], correct: 0 },
        { text: "46. Что является основной задачей ветки develop в Git Flow с точки зрения тестирования?", options: ["A) хранение production-версии без изменений", "B) интеграция новых функций перед релизной стабилизацией", "C) срочное исправление дефектов на production", "D) хранение только документации"], correct: 1 },
        { text: "47. Зачем используется ветка release в Git Flow?", options: ["A) для финальной стабилизации версии, исправлений и релизного тестирования", "B) для разработки новых функций с нуля", "C) для удаления истории коммитов", "D) для хранения экспериментального кода без тестов"], correct: 0 },
        { text: "48. Когда особенно важна ветка hotfix?", options: ["A) при срочном исправлении критического дефекта production-версии", "B) при плановой разработке новой функции", "C) при написании учебных тестов", "D) при переименовании README"], correct: 0 },
        { text: "49. Что делает команда git merge?", options: ["A) объединяет изменения из одной ветки с другой", "B) удаляет все локальные изменения", "C) создаёт удалённый репозиторий", "D) отменяет последний push"], correct: 0 },
        { text: "50. Почему история коммитов полезна при анализе дефекта?", options: ["A) она автоматически исправляет дефекты", "B) она позволяет определить изменение, после которого могла появиться ошибка", "C) она заменяет баг-репорт", "D) она полностью исключает необходимость тестирования"], correct: 1 },
        { text: "51. Почему совместное использование одной базы данных несколькими тестами без очистки состояния считается архитектурной ошибкой тестов?", options: ["A) потому что тесты могут влиять друг на друга через изменённые данные", "B) потому что база данных всегда работает медленнее файлов", "C) потому что pytest не поддерживает базы данных", "D) потому что это запрещает использование assert"], correct: 0 },
        { text: "52. Почему отсутствие изоляции тестовой среды снижает достоверность результатов тестирования?", options: ["A) тесты начинают зависеть от внешнего состояния и предыдущих запусков", "B) тесты всегда становятся быстрее", "C) уменьшается количество файлов проекта", "D) невозможно использовать Git"], correct: 0 },
        { text: "53. Что означает высокая диагностическая ценность теста?", options: ["A) тест проверяет как можно больше требований одновременно", "B) тест помогает быстро понять, какая часть системы работает некорректно", "C) тест обязательно должен быть длинным", "D) тест не должен содержать ожидаемого результата"], correct: 1 },

        { text: "56. Какой риск возникает при использовании случайных тестовых данных без фиксированного seed?", options: ["A) невозможно воспроизвести найденный дефект в тех же условиях", "B) тесты всегда становятся успешными", "C) pytest перестаёт запускаться", "D) assert перестаёт работать"], correct: 0 },
        { text: "57. Почему профилирование данных важно перед нагрузочным тестированием?", options: ["A) оно позволяет сформировать более реалистичные объёмы и распределения тестовых данных", "B) оно заменяет все нагрузочные тесты", "C) оно уменьшает количество пользователей системы", "D) оно автоматически оптимизирует SQL-запросы"], correct: 0 },
        { text: "58. Почему тестирование рассматривается как непрерывный процесс управления качеством?", options: ["A) потому что любые изменения системы могут создавать новые дефекты", "B) потому что тесты пишутся только после релиза", "C) потому что тестирование заменяет разработку", "D) потому что тестирование всегда выполняется вручную"], correct: 0 },
        { text: "59. В каком случае тестирование серого ящика повышает эффективность интеграционного тестирования?", options: ["A) когда нет требований и документации", "B) когда тестировщик использует частичную информацию о взаимодействии модулей, API и данных", "C) когда тестируется только внешний вид интерфейса", "D) когда отсутствует доступ к тестовой среде"], correct: 1 },

    function getRandomItems(arr, count) {
        const shuffled = [...arr];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled.slice(0, count);

    });
    document.addEventListener('click', (e) => {
        if (!configToggleBtn.contains(e.target) && !configDropdown.contains(e.target)) configDropdown.classList.remove('open');
    });

    function rebuildExam() {
        let qCount = parseInt(totalLimitInput.value);
        if (isNaN(qCount)) qCount = 30;
        qCount = Math.min(60, Math.max(10, qCount));
        currentQuestions = getRandomItems(fullBank, qCount);
        userAnswers = new Array(currentQuestions.length).fill(null);
        currentIndex = 0;
        correctCount = 0;
        answerLock = false;
        totalCountSpan.innerText = currentQuestions.length;
        totalSpan.innerText = currentQuestions.length;
        finalResultsDiv.style.display = 'none';
        dynamicContent.style.display = 'block';
        renderNavigation();
        renderCurrentQuestion();
    }

    function renderNavigation() {
        navContainer.innerHTML = '';
        for (let i = 0; i < currentQuestions.length; i++) {
            const rect = document.createElement('div');
            rect.classList.add('nav-rect');
            if (userAnswers[i] !== null) rect.classList.add('answered-status');
            if (i === currentIndex) rect.classList.add('active-rect');
            rect.addEventListener('click', (function(idx) { return function() {
                if (currentIndex !== idx) {
                    currentIndex = idx;
                    renderCurrentQuestion();
                    renderNavigation();
                }
            }; })(i));
            navContainer.appendChild(rect);
        }
        const activeRect = navContainer.querySelector('.active-rect');
        if (activeRect) activeRect.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }

    function updateStatsUI() {
        currentNumSpan.innerText = currentIndex + 1;
        correctCounterSpan.innerText = correctCount;
        const percent = (correctCount / currentQuestions.length) * 100;
        progressFill.style.width = `${percent}%`;
    }

    function renderCurrentQuestion() {
        if (currentIndex >= currentQuestions.length) { finishExam(); return; }
        const q = currentQuestions[currentIndex];
        questionTextDiv.innerText = q.text;
        optionsContainer.innerHTML = '';
        const saved = userAnswers[currentIndex];
        answerLock = (saved !== null);
        q.options.forEach((opt, idx) => {
            const div = document.createElement('div');
            div.className = 'option-item';
            div.innerHTML = `<div class="prefix">${String.fromCharCode(65+idx)}</div><div class="option-text">${opt}</div>`;
            if (saved !== null) {
                div.classList.add('disabled-opt');
                if (idx === q.correct) div.classList.add('correct-highlight');
                if (idx === saved.selectedIdx && idx !== q.correct) div.classList.add('wrong-highlight');
            } else {
                div.addEventListener('click', () => handleAnswer(idx, q.correct));
            }
            optionsContainer.appendChild(div);
        });
        if (saved !== null) {
            feedbackDiv.style.display = 'block';
            feedbackDiv.innerHTML = `<strong>${saved.isCorrect ? '✅ Верно' : '❌ Неверно'}. Правильный ответ: ${String.fromCharCode(65+q.correct)}.</strong>`;
        } else {
            feedbackDiv.style.display = 'none';
            feedbackDiv.innerHTML = '';
        }
        updateStatsUI();
        renderNavigation();
    }

    function handleAnswer(selected, correctIdx) {
        if (answerLock) return;
        const isCorrect = (selected === correctIdx);
        if (isCorrect) correctCount++;
        userAnswers[currentIndex] = { selectedIdx: selected, isCorrect, correctIdx };
        answerLock = true;
        renderCurrentQuestion();
    }

    function nextQuestion() {
        if (!answerLock && userAnswers[currentIndex] === null) {
            feedbackDiv.style.display = 'block';
            feedbackDiv.innerHTML = '<strong>⚠️ Выберите вариант ответа!</strong>';
            return;
        }
        if (currentIndex + 1 < currentQuestions.length) {
            currentIndex++;
            renderCurrentQuestion();
        } else if (currentIndex + 1 === currentQuestions.length) {
            if (userAnswers[currentIndex] !== null || answerLock) finishExam();
            else {
                feedbackDiv.style.display = 'block';
                feedbackDiv.innerHTML = '<strong>⚠️ Ответьте на последний вопрос!</strong>';
            }
        }
    }

    function finishExam() {
        const total = currentQuestions.length;
        const percent = Math.round((correctCount / total) * 100);
        const gradeMsg = percent >= 80 ? 'Отлично! 🎉' : (percent >= 60 ? 'Хорошо 👍' : 'Стоит повторить');
        finalResultsDiv.style.display = 'block';
        finalResultsDiv.innerHTML = `
            <div class="result-panel">
                <div class="finish-stats">🏁 Экзамен завершён</div>
                <div style="font-size:1rem; margin:10px 0;">Правильных: ${correctCount} из ${total} (${percent}%)</div>
                <div style="font-weight:500;">${gradeMsg}</div>
                <button id="restartFinishBtn" class="apply-config" style="margin-top:16px;">🔄 Пройти заново</button>
            </div>
        `;
        document.getElementById('restartFinishBtn')?.addEventListener('click', () => rebuildExam());
        dynamicContent.style.display = 'none';
    }

    applyConfigBtn.addEventListener('click', () => rebuildExam());
    resetBtn.addEventListener('click', () => rebuildExam());
    nextBtn.addEventListener('click', nextQuestion);
    rebuildExam();
</script>
</body>
</html>
