<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Экзамен МДК 05.01 (умный билет) — Тёмная тема</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a0f1c;
            font-family: system-ui, -apple-system, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            padding: 16px 12px 30px 12px;
            color: #eef2ff;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .exam-card {
            background: #111827;
            border-radius: 20px;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            border: 1px solid #2d3a4e;
        }

        .header {
            background: #0b1120;
            padding: 16px 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #2d3a4e;
        }

        .title h1 {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(135deg, #FDE68A, #F59E0B);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }

        .title p {
            font-size: 0.7rem;
            opacity: 0.7;
            margin-top: 4px;
        }

        .stats {
            background: #1e2a3e;
            padding: 6px 12px;
            border-radius: 12px;
            font-weight: 600;
            display: flex;
            gap: 12px;
            font-size: 0.75rem;
        }

        .stats span {
            background: #f4c542;
            color: #1e2a3a;
            padding: 2px 8px;
            border-radius: 20px;
            margin-left: 6px;
        }

        .config-popup {
            position: relative;
        }
        .config-toggle, .mode-toggle {
            background: #1e293b;
            border: 1px solid #3b4a62;
            color: #f4c542;
            padding: 6px 14px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            white-space: nowrap;
        }
        .mode-toggle.exam-active {
            border-color: #f4c542;
            color: #facc15;
            background: #2a3547;
        }
        .config-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 16px;
            width: 260px;
            z-index: 200;
            box-shadow: 0 12px 28px rgba(0,0,0,0.5);
            display: none;
            flex-direction: column;
            gap: 14px;
            backdrop-filter: blur(4px);
        }
        .config-dropdown.open {
            display: flex;
        }
        .config-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .config-item label {
            font-weight: 500;
            font-size: 0.85rem;
        }
        .config-item input {
            background: #0f172a;
            border: 1px solid #4b5563;
            color: #facc15;
            padding: 8px 10px;
            border-radius: 12px;
            width: 80px;
            text-align: center;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .apply-config {
            background: #f4c542;
            color: #0f172a;
            border: none;
            padding: 10px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 0.85rem;
            margin-top: 4px;
        }

        .progress-area {
            padding: 12px 20px 8px 20px;
            background: #0f172a;
            border-bottom: 1px solid #2d3a4e;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            font-weight: 500;
            margin-bottom: 6px;
        }

        .bar-bg {
            background: #2d3a4e;
            border-radius: 10px;
            height: 6px;
            overflow: hidden;
        }

        .bar-fill {
            background: #f4c542;
            width: 0%;
            height: 100%;
            border-radius: 10px;
            transition: width 0.2s ease;
        }

        .question-nav {
            background: #0f172a;
            padding: 12px 16px;
            border-bottom: 1px solid #2d3a4e;
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
            display: flex;
            gap: 8px;
            scrollbar-width: thin;
            -webkit-overflow-scrolling: touch;
        }
        .question-nav::-webkit-scrollbar {
            height: 3px;
        }
        .nav-rect {
            display: inline-flex;
            min-width: 40px;
            height: 40px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.1s;
            flex-shrink: 0;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #cbd5e6;
        }
        .nav-rect.active-rect {
            background: #f4c542;
            border-color: #facc15;
            box-shadow: 0 0 0 2px rgba(244,197,66,0.4);
            color: #0f172a;
        }

        .question-area {
            padding: 20px 16px 20px 16px;
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 500;
            line-height: 1.45;
            margin-bottom: 24px;
            background: #111c2e;
            padding: 16px 18px;
            border-radius: 18px;
            border-left: 5px solid #f4c542;
            word-break: break-word;
            white-space: pre-wrap;
            font-family: monospace;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .option-item {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 12px 16px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.12s;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            color: #f1f5f9;
        }

        .option-item:hover {
            background: #2d3a4e;
            border-color: #f4c542;
        }

        .prefix {
            font-weight: 800;
            background: #2d3a4e;
            min-width: 32px;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            color: #facc15;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .option-text {
            flex: 1;
            line-height: 1.4;
            white-space: pre-wrap;
        }

        .option-item.correct-feedback {
            background: #14532d;
            border-color: #4ade80;
            pointer-events: none;
        }

        .option-item.wrong-feedback {
            background: #7f1a1a;
            border-color: #f87171;
            pointer-events: none;
        }

        .feedback {
            background: #1e293b;
            border-radius: 16px;
            padding: 14px 18px;
            margin: 12px 0 18px;
            font-size: 0.9rem;
            border-left: 4px solid #f4c542;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        .next-btn, .reset-exam-btn {
            background: #f4c542;
            color: #0f172a;
            border: none;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 12px 16px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            flex: 1;
            text-align: center;
        }

        .reset-exam-btn {
            background: #334155;
            color: #f1f5f9;
        }
        .reset-exam-btn:active, .next-btn:active {
            transform: scale(0.97);
        }

        .result-panel {
            background: #0f172a;
            padding: 20px 18px;
            border-radius: 24px;
            text-align: center;
            margin: 20px 16px 30px;
            border: 1px solid #f4c542;
        }

        .finish-stats {
            font-size: 1.3rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        footer {
            text-align: center;
            margin-top: 16px;
            font-size: 0.65rem;
            color: #6c757d;
        }

        @media (max-width: 480px) {
            body {
                padding: 12px 10px 24px 10px;
            }
            .header {
                padding: 12px 16px;
            }
            .title h1 {
                font-size: 1.2rem;
            }
            .stats {
                padding: 4px 10px;
                gap: 8px;
            }
            .question-text {
                font-size: 0.95rem;
                padding: 14px 16px;
            }
            .option-item {
                padding: 10px 14px;
                gap: 10px;
            }
            .prefix {
                min-width: 28px;
                height: 28px;
                font-size: 0.8rem;
            }
            .nav-rect {
                min-width: 34px;
                height: 34px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="exam-card">
        <div class="header">
            <div class="title">
                <h1>📘 МДК 05.01 (умный билет)</h1>
                <p id="mode-description">Правильный ответ удаляет вопрос • Ошибайся — учись</p>
            </div>
            <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                <button id="modeToggleBtn" class="mode-toggle exam-active">📚 Режим: Экзамен</button>
                <div class="stats">
                    <div>📋 <span id="total-count">0</span></div>
                    <div id="correct-stat-label">✅</div> <span id="correct-counter">0</span>
                </div>
                <div class="config-popup">
                    <button id="configToggleBtn" class="config-toggle">⚙️</button>
                    <div id="configDropdown" class="config-dropdown">
                        <div class="config-item"><label>🎯 Кол-во вопросов:</label><input type="number" id="total-limit" min="10" max="75" value="30" step="1"></div>
                        <button id="applyConfigBtn" class="apply-config">🎲 Применить</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="progress-area" id="progress-area">
            <div class="progress-text">
                <span>📖 Вопрос <span id="current-num">1</span> / <span id="total-questions">0</span></span>
                <span id="progress-label">🏆 Выучено:</span> <span id="correct-progress">0</span>
            </div>
            <div class="bar-bg"><div class="bar-fill" id="progress-fill"></div></div>
        </div>

        <div id="nav-buttons-container" class="question-nav"></div>

        <div id="dynamic-content">
            <div class="question-area">
                <div class="question-text" id="question-text">Загрузка...</div>
                <div class="options-list" id="options-container"></div>
                <div id="feedback-area" class="feedback" style="display: none;"></div>
                <div class="action-buttons">
                    <button id="resetButton" class="reset-exam-btn">🔄 Сброс</button>
                    <button id="nextButton" class="next-btn">➡️ Дальше</button>
                </div>
            </div>
        </div>
        <div id="final-results" style="display: none;"></div>
    </div>
    <footer id="footer-text">✨ Верный ответ → вопрос исчезает навсегда. Неверный → остаётся для повторной попытки.</footer>
</div>

<script>
    // ==================== ПОЛНАЯ БАЗА (75 вопросов МДК 05.01) ====================
    const fullBank = [
        { text: "1. В ходе анализа предметной области системы доставки команда обнаружила, что разные отделы используют разные правила изменения статуса заказа. В результате один и тот же заказ может одновременно считаться «отправленным» и «ожидающим обработки». Какое решение наиболее корректно:", options: ["A) Формализовать единый жизненный цикл заказа и правила переходов состояний", "B) Увеличить количество таблиц в базе данных", "C) Разделить систему на большее количество интерфейсов", "D) Ограничить доступ пользователей к изменению статусов"], correct: 0 },
        { text: "2. При декомпозиции IDEF0-модели нижний уровень начал содержать функции, не связанные с родительским процессом. Какой вывод наиболее обоснован:", options: ["A) Нарушена логическая целостность декомпозиции", "B) Недостаточно подробно описаны интерфейсы системы", "C) Используется неподходящий язык программирования", "D) Требуется изменить структуру базы данных"], correct: 0 },
        { text: "3. В системе учёта товаров разные модули независимо изменяют информацию о наличии продукции. Со временем данные начинают противоречить друг другу. В чём основная причина проблемы:", options: ["A) Отсутствует единый источник ответственности за состояние данных", "B) Используется слишком большое количество пользователей", "C) Неверно выбрана CASE-среда", "D) Избыточно детализированы бизнес-процессы"], correct: 0 },
        { text: "4. При проектировании архитектуры команда стремится заранее предусмотреть все возможные будущие сценарии развития системы. В результате проект становится чрезмерно сложным ещё до начала внедрения. Какой риск наиболее вероятен:", options: ["A) Архитектура станет сложнее сопровождать и изменять", "B) Снизится скорость работы базы данных", "C) Упростится масштабирование системы", "D) Уменьшится количество компонентов"], correct: 0 },
        { text: "5. В процессе анализа предметной области были подробно описаны действия пользователей, но не определены ограничения и правила выполнения операций. Что наиболее вероятно произойдёт на этапе реализации:", options: ["A) Поведение системы будет интерпретироваться разработчиками по-разному", "B) Упростится распределение ответственности", "C) Снизится количество изменений требований", "D) Уменьшится сложность архитектуры"], correct: 0 },
        { text: "6. В API системы бронирования один и тот же запрос иногда возвращает полную информацию о клиенте, а иногда только часть полей, хотя документация описывает единый формат. Какой риск здесь наиболее существенен:", options: ["A) Клиенты начнут строить неверные предположения о контракте", "B) Увеличится нагрузка на сервер", "C) Упростится интеграция между системами", "D) Снизится количество запросов к базе данных"], correct: 0 },
        { text: "7. В системе управления складом данные о поставках хранятся одновременно в нескольких таблицах и изменяются независимо. Через некоторое время информация начинает расходиться. Какая ошибка наиболее вероятна:", options: ["A) Нарушена целостность модели данных", "B) Используется слишком сложная структура интерфейсов", "C) Недостаточно подробно описаны роли пользователей", "D) Неверно выбрана технология визуализации"], correct: 0 },
        { text: "8. При проектировании системы команда выделила множество отдельных модулей, однако их зависимости друг от друга оказались настолько сильными, что изменение одного компонента требует изменения остальных. Какой вывод наиболее корректен:", options: ["A) Декомпозиция выполнена формально, без реального разделения ответственности", "B) Используется недостаточное количество сущностей", "C) Архитектура слишком проста для развития", "D) Отсутствует система резервного копирования"], correct: 0 },
        { text: "9. В процессе анализа предметной области команда использует интервью и документы, но не проверяет противоречия между источниками информации. Какой риск возникает:", options: ["A) В систему будут заложены несовместимые бизнес-правила", "B) Упростится сопровождение архитектуры", "C) Увеличится производительность системы", "D) Снизится количество изменений требований"], correct: 0 },
        { text: "10. В системе интернет-магазина при отмене заказа часть связанных данных обновляется, а часть остаётся неизменной. В результате появляются «зависшие» состояния. Какое архитектурное упущение наиболее вероятно:", options: ["A) Не определены правила согласованного изменения связанных данных", "B) Используется реляционная база данных", "C) Недостаточно подробно описан интерфейс пользователя", "D) Отсутствует документация API"], correct: 0 },
        { text: "11. В ходе проектирования системы команда ориентируется исключительно на текущие требования, полностью игнорируя возможный рост нагрузки и функциональности. Какое последствие наиболее вероятно:", options: ["A) Система станет сложной для развития при изменении требований", "B) Снизится количество интеграционных ошибок", "C) Упростится сопровождение компонентов", "D) Уменьшится количество зависимостей"], correct: 0 },
        { text: "12. В проекте отсутствует явное разделение между логикой обработки заказов и логикой работы с базой данных. Почему это является проблемой:", options: ["A) Изменения бизнес-правил будут затрагивать множество частей системы", "B) Повысится надёжность хранения данных", "C) Упростится масштабирование системы", "D) Снизится количество дублирования логики"], correct: 0 },
        { text: "13. При моделировании бизнес-процесса команда фиксирует последовательность действий, но не учитывает альтернативные сценарии и исключения. К чему это приведёт:", options: ["A) Реальное поведение системы окажется неполным", "B) Снизится сложность архитектуры", "C) Упростится проектирование интерфейсов", "D) Увеличится производительность системы"], correct: 0 },
        { text: "14. В системе разные разработчики по-разному трактуют понятие «активный клиент». Какой шаг наиболее рационален:", options: ["A) Зафиксировать единое определение сущности и её состояний", "B) Увеличить количество пользовательских ролей", "C) Разделить базу данных на дополнительные таблицы", "D) Ограничить доступ к документации"], correct: 0 },
        { text: "15. При проектировании БД для финансовой системы команда выбрала структуру, удобную для хранения данных, но неудобную для выполнения основных операций. Какое последствие наиболее вероятно:", options: ["A) Система будет неэффективна при реальной эксплуатации", "B) Упростится сопровождение бизнес-логики", "C) Снизится количество изменений требований", "D) Уменьшится связность компонентов"], correct: 0 },
        { text: "16. В системе роли пользователей определены неявно, и доступ к операциям проверяется в разных частях кода независимо. Какой риск наиболее вероятен:", options: ["A) Поведение системы станет непредсказуемым и трудным для контроля", "B) Упростится добавление новых функций", "C) Повысится гибкость архитектуры", "D) Снизится сложность сопровождения"], correct: 0 },
        { text: "17. При анализе предметной области команда слишком рано переходит к проектированию интерфейсов, не завершив формализацию сущностей и процессов. Какое последствие наиболее вероятно:", options: ["A) Интерфейсы начнут отражать противоречивую модель системы", "B) Увеличится производительность приложения", "C) Снизится сложность бизнес-логики", "D) Упростится тестирование системы"], correct: 0 },
        { text: "18. В API системы изменения структуры ответов выполняются без согласования с внешними потребителями. Почему это особенно опасно:", options: ["A) Интеграции начинают зависеть от нестабильного поведения системы", "B) Уменьшается объём передаваемых данных", "C) Повышается гибкость пользовательского интерфейса", "D) Снижается количество запросов к серверу"], correct: 0 },
        { text: "19. В процессе проектирования команда старается минимизировать количество компонентов системы, объединяя различную логику в общие модули. Какой риск возникает:", options: ["A) Компоненты начинают брать на себя слишком много ответственности", "B) Упрощается изменение бизнес-логики", "C) Снижается количество зависимостей", "D) Повышается прозрачность архитектуры"], correct: 0 },
        { text: "20. В системе мониторинга фиксируются ошибки, но невозможно определить, какие действия пользователя привели к сбою. Какое решение наиболее корректно:", options: ["A) Ввести механизмы связывания событий и идентификаторы запросов", "B) Увеличить объём записываемых логов", "C) Уменьшить количество собираемых событий", "D) Разделить базу данных на дополнительные таблицы"], correct: 0 },
        { text: "21. При проектировании архитектуры команда выбирает технологию исключительно из-за её популярности, не учитывая особенности проекта. Какой риск наиболее вероятен:", options: ["A) Технологические решения не будут соответствовать реальным задачам системы", "B) Упростится сопровождение приложения", "C) Увеличится гибкость интеграции", "D) Снизится сложность модели данных"], correct: 0 },
        { text: "22. В системе изменения требований приводят к переписыванию большого количества компонентов. Что это наиболее вероятно означает:", options: ["A) Архитектура обладает высокой связностью", "B) Система недостаточно детализирована", "C) Используется слишком большое количество сущностей", "D) Недостаточно подробно описаны интерфейсы"], correct: 0 },
        { text: "23. В процессе моделирования бизнес-процессов команда описывает только успешные сценарии выполнения операций. Почему это является проблемой:", options: ["A) Исключительные ситуации не будут корректно обработаны системой", "B) Снизится сложность пользовательских интерфейсов", "C) Упростится структура базы данных", "D) Уменьшится количество компонентов"], correct: 0 },
        { text: "24. В системе один модуль напрямую изменяет внутренние данные другого модуля. Какое последствие наиболее вероятно:", options: ["A) Нарушение границ ответственности между компонентами", "B) Увеличение производительности системы", "C) Упрощение интеграции модулей", "D) Снижение количества зависимостей"], correct: 0 },
        { text: "25. При проектировании долгосрочной архитектуры необходимо учитывать не только функциональность, но и развитие системы, ограничения команды и изменение требований. Какой подход наиболее зрелый:", options: ["A) Балансировать простоту, расширяемость и реальные ограничения проекта", "B) Максимально усложнять архитектуру для будущих сценариев", "C) Сосредоточиться только на текущей реализации функций", "D) Минимизировать количество компонентов независимо от задач системы"], correct: 0 },
        { text: "26. Что называется связностью компонентов системы?", options: ["A) Степень зависимости модулей друг от друга", "B) Скорость выполнения запросов", "C) Объём базы данных", "D) Количество пользователей системы"], correct: 0 },
        { text: "27. Верно ли утверждение: «Чем меньше связность между компонентами, тем проще изменять систему».", options: ["A) Верно", "B) Неверно"], correct: 0 },
        { text: "28. Что является основной целью версионирования API:", options: ["A) Сохранение совместимости при изменении интерфейса", "B) Увеличение скорости работы сервера", "C) Снижение объёма передаваемых данных", "D) Уменьшение количества пользователей"], correct: 0 },
        { text: "29. Установите соответствие между понятиями и определениями:\n1-Сущность, 2-Атрибут, 3-Бизнес-процесс, 4-Ограничение", options: ["A) 1D,2B,3C,4A", "B) 1B,2D,3A,4C", "C) 1D,2C,3B,4A", "D) 1A,2B,3C,4D"], correct: 0 },
        { text: "30. Что наиболее вероятно произойдёт при отсутствии единого жизненного цикла сущности:", options: ["A) Возможны противоречивые состояния данных", "B) Упростится масштабирование системы", "C) Уменьшится количество ошибок", "D) Повысится производительность базы данных"], correct: 0 },
        { text: "31. Верно ли утверждение: «Документация API должна отражать фактическое поведение системы».", options: ["A) Верно", "B) Неверно"], correct: 0 },
        { text: "32. Что является основной задачей логирования:", options: ["A) Фиксация событий и ошибок системы", "B) Ускорение работы базы данных", "C) Управление доступом пользователей", "D) Масштабирование серверов"], correct: 0 },
        { text: "33. При проектировании системы несколько модулей начинают дублировать одинаковую бизнес-логику. Какой риск наиболее вероятен:", options: ["A) Изменения придётся вносить сразу в несколько мест", "B) Повысится гибкость архитектуры", "C) Упростится сопровождение системы", "D) Уменьшится вероятность ошибок"], correct: 0 },
        { text: "34. Что называется декомпозицией процесса:", options: ["A) Разделение процесса на более мелкие функции", "B) Объединение нескольких модулей", "C) Удаление бизнес-логики", "D) Сокращение количества пользователей"], correct: 0 },
        { text: "35. Верно ли утверждение: «Нефункциональные требования влияют на архитектурные решения системы».", options: ["A) Верно", "B) Неверно"], correct: 0 },
        { text: "36. В ходе анализа предметной области команда описала действия пользователей, но не определила роли исполнителей. Какое последствие наиболее вероятно:", options: ["A) Сложности при распределении ответственности и логики", "B) Упрощение проектирования интерфейсов", "C) Повышение производительности системы", "D) Уменьшение количества компонентов"], correct: 0 },
        { text: "37. Что наиболее важно учитывать при проектировании системы с ожидаемым ростом нагрузки:", options: ["A) Возможность масштабирования архитектуры", "B) Только внешний вид интерфейса", "C) Количество используемых диаграмм", "D) Цветовую схему приложения"], correct: 0 },
        { text: "38. Установите соответствие:\n1-Монолитная архитектура, 2-Слабая связность, 3-API, 4-Нефункциональное требование", options: ["A) 1B,2D,3C,4A", "B) 1C,2B,3A,4D", "C) 1D,2C,3B,4A", "D) 1A,2B,3C,4D"], correct: 0 },
        { text: "39. Что является основной проблемой отсутствия мониторинга системы:", options: ["A) Ошибки и сбои обнаруживаются слишком поздно", "B) Уменьшается объём логов", "C) Снижается количество пользователей", "D) Ускоряется работа серверов"], correct: 0 },
        { text: "40. Верно ли утверждение: «Высокая связность упрощает изменение отдельных компонентов системы».", options: ["A) Верно", "B) Неверно"], correct: 1 },
        { text: "41. При проектировании системы команда объединяет разные функции в один общий модуль ради уменьшения количества компонентов. Какой риск наиболее вероятен:", options: ["A) Модуль станет перегруженным и трудным для сопровождения", "B) Упростится изменение бизнес-логики", "C) Повысится независимость компонентов", "D) Уменьшится количество ошибок"], correct: 0 },
        { text: "42. Что называется контрактом взаимодействия между системами:", options: ["A) API", "B) Мониторинг", "C) CASE-средство", "D) Резервное копирование"], correct: 0 },
        { text: "43. Верно ли утверждение: «При изменении структуры API без версионирования могут возникнуть проблемы совместимости».", options: ["A) Верно", "B) Неверно"], correct: 0 },
        { text: "44. Что наиболее вероятно произойдёт при отсутствии проверки противоречий в требованиях:", options: ["A) В системе появятся несовместимые правила и сценарии", "B) Упростится сопровождение проекта", "C) Снизится количество изменений требований", "D) Повысится производительность базы данных"], correct: 0 },
        { text: "45. Установите соответствие:\n1-Логирование, 2-Резервное копирование, 3-IDEF0, 4-Масштабируемость", options: ["A) 1C,2B,3D,4A", "B) 1A,2C,3B,4D", "C) 1D,2A,3C,4B", "D) 1B,2D,3A,4C"], correct: 0 },
        { text: "46. Что наиболее важно при проектировании долгосрочной архитектуры:", options: ["A) Учитывать изменения требований и ограничения проекта", "B) Максимально усложнять структуру системы", "C) Использовать как можно больше технологий", "D) Минимизировать количество сущностей независимо от задач"], correct: 0 },
        { text: "47. Верно ли утверждение: «Если разные модули напрямую изменяют общие данные, вероятность ошибок согласованности возрастает».", options: ["A) Верно", "B) Неверно"], correct: 0 },
        { text: "48. При моделировании процессов описаны только основные успешные сценарии. Какой риск наиболее вероятен:", options: ["A) Исключительные ситуации окажутся неучтёнными", "B) Снизится сложность системы", "C) Упростится архитектура приложения", "D) Повысится производительность"], correct: 0 },
        { text: "49. Что называется жизненным циклом сущности:", options: ["A) Набор состояний объекта и правил переходов между ними", "B) Скорость обработки данных системой", "C) Способ хранения резервных копий", "D) Последовательность запуска серверов"], correct: 0 },
        { text: "50. Верно ли утверждение: «Архитектурные решения должны учитывать не только текущие требования, но и возможное развитие системы».", options: ["A) Верно", "B) Неверно"], correct: 0 },
        { text: "51. В системе отсутствует единое место проверки прав доступа, и разные модули реализуют проверки независимо. Какой риск наиболее вероятен:", options: ["A) Поведение системы станет непредсказуемым", "B) Упростится сопровождение системы", "C) Снизится количество ошибок", "D) Повысится гибкость архитектуры"], correct: 0 },
        { text: "52. Что является основной целью анализа требований:", options: ["A) Формализация ожиданий и правил работы системы", "B) Настройка серверного оборудования", "C) Оптимизация сетевого трафика", "D) Разработка пользовательского интерфейса"], correct: 0 },
        { text: "53. Верно ли утверждение: «Слабая связность компонентов повышает гибкость системы».", options: ["A) Верно", "B) Неверно"], correct: 0 },
        { text: "54. Установите соответствие:\n1-Интерфейс, 2-Ограничение, 3-Бизнес-логика, 4-Согласованность данных", options: ["A) 1C,2D,3B,4A", "B) 1B,2A,3D,4C", "C) 1A,2C,3B,4D", "D) 1D,2B,3A,4C"], correct: 0 },
        { text: "55. Что наиболее вероятно произойдёт при чрезмерном усложнении архитектуры без реальной необходимости:", options: ["A) Система станет сложнее сопровождать и развивать", "B) Упростится внедрение новых функций", "C) Уменьшится количество ошибок", "D) Повысится независимость компонентов"], correct: 0 },
        { text: "56. Верно ли утверждение: «Наличие резервных копий без проверки восстановления не гарантирует надёжность системы».", options: ["A) Верно", "B) Неверно"], correct: 0 },
        { text: "57. Что является основной целью выделения границ между компонентами системы:", options: ["A) Разделение ответственности и уменьшение зависимости", "B) Увеличение количества модулей", "C) Усложнение архитектуры", "D) Повышение нагрузки на сервер"], correct: 0 },
        { text: "58. При проектировании API разные команды используют собственные форматы ошибок и ответов. Какое последствие наиболее вероятно:", options: ["A) Интеграция между системами станет сложнее", "B) Упростится сопровождение клиентов", "C) Снизится вероятность ошибок", "D) Повысится гибкость взаимодействия"], correct: 0 },
        { text: "59. Верно ли утверждение: «Выбор технологий должен учитывать особенности предметной области и требований проекта».", options: ["A) Верно", "B) Неверно"], correct: 0 },
        { text: "60. Что наиболее важно при проектировании качественной информационной системы:", options: ["A) Баланс между требованиями, архитектурой и ограничениями проекта", "B) Использование максимального количества технологий", "C) Минимизация количества компонентов любой ценой", "D) Сосредоточение только на пользовательском интерфейсе"], correct: 0 },
        { text: "61. Команда разрабатывает небольшую внутреннюю систему для компании из 20 сотрудников, однако архитектура сразу проектируется как набор независимых микросервисов с отдельными базами данных и сложным взаимодействием. Какое решение наиболее рационально:", options: ["A) Упростить архитектуру, сохранив возможность дальнейшего разделения", "B) Добавить ещё больше сервисов для гибкости", "C) Полностью отказаться от разделения компонентов", "D) Увеличить количество используемых технологий"], correct: 0 },
        { text: "62. В системе часто возникают ошибки согласованности данных между связанными сущностями. Что наиболее важно исправить в первую очередь:", options: ["A) Определить единые правила изменения связанных данных", "B) Изменить интерфейс пользователя", "C) Увеличить объём логирования", "D) Добавить новые пользовательские роли"], correct: 0 },
        { text: "63. В проекте требуется быстро выпустить первую версию системы, однако команда начинает реализовывать сложную универсальную архитектуру «на будущее». Какой риск наиболее вероятен:", options: ["A) Сроки разработки значительно увеличатся без реальной необходимости", "B) Система станет слишком простой для поддержки", "C) Уменьшится гибкость изменений", "D) Снизится количество компонентов"], correct: 0 },
        { text: "64. Верно ли утверждение: «Слишком детализированная архитектура может быть такой же проблемой, как и недостаточная детализация».", options: ["A) Верно", "B) Неверно"], correct: 0 },
        { text: "65. В API системы разные команды используют собственные правила именования полей и форматов ошибок. Какое решение наиболее рационально:", options: ["A) Ввести единые стандарты проектирования API", "B) Разрешить каждой команде самостоятельно выбирать формат", "C) Уменьшить количество endpoint’ов", "D) Ограничить изменение структуры ответов"], correct: 0 },
        { text: "66. Установите соответствие:\n1-Слабая связность, 2-Жизненный цикл сущности, 3-Контракт API, 4-Масштабируемость", options: ["A) 1B,2D,3C,4A", "B) 1A,2C,3D,4B", "C) 1D,2A,3B,4C", "D) 1C,2B,3A,4D"], correct: 0 },
        { text: "67. В системе регулярно появляются ошибки доступа: разные части приложения по-разному трактуют права пользователей. Что наиболее важно исправить в первую очередь:", options: ["A) Централизовать правила проверки доступа", "B) Увеличить объём логирования", "C) Разделить интерфейс на дополнительные страницы", "D) Изменить структуру базы данных"], correct: 0 },
        { text: "68. При проектировании системы команда спорит между двумя решениями:\n — первое проще реализовать сейчас, но сложнее расширять;\n — второе сложнее на старте, но лучше подходит для будущего роста.\nКакой подход наиболее зрелый:", options: ["A) Оценивать решение с учётом реальных требований и вероятности изменений", "B) Всегда выбирать наиболее сложную архитектуру", "C) Всегда выбирать самое быстрое решение", "D) Полностью игнорировать возможное развитие системы"], correct: 0 },
        { text: "69. Верно ли утверждение: «Наличие документации не гарантирует её актуальность и соответствие реальному поведению системы».", options: ["A) Верно", "B) Неверно"], correct: 0 },
        { text: "70. Почему высокая связность компонентов усложняет развитие системы?", options: ["A) Изменения в одном компоненте вызывают каскадные изменения в других", "B) Уменьшается количество модулей", "C) Повышается производительность", "D) Упрощается тестирование"], correct: 0 },
        { text: "71. Что означает балансировка между уровнями в IDEF0-модели?", options: ["A) Равномерное распределение функций между уровнями без излишней детализации или укрупнения", "B) Максимальная детализация всех процессов", "C) Использование только одного уровня", "D) Удаление всех управляющих стрелок"], correct: 0 },
        { text: "72. В системе интернет-магазина оформление заказа зависит сразу от нескольких модулей: оплаты, склада и доставки. При сбоях часть операций выполняется, а часть — нет. Какой риск наиболее вероятен:", options: ["A) Появление несогласованных состояний данных", "B) Упрощение сопровождения системы", "C) Повышение гибкости архитектуры", "D) Снижение количества ошибок"], correct: 0 },
        { text: "73. Верно ли утверждение: «При проектировании архитектуры необходимо учитывать возможности и размер команды разработки».", options: ["A) Верно", "B) Неверно"], correct: 0 },
        { text: "74. В процессе развития проекта требования регулярно изменяются. Какое архитектурное свойство становится наиболее важным:", options: ["A) Гибкость и возможность изменения компонентов", "B) Максимальное количество технологий", "C) Минимальное число сущностей", "D) Жёсткая фиксация структуры системы"], correct: 0 },
        { text: "75. В ходе анализа предметной области команда описала основные сущности, но не определила их границы ответственности. Какое последствие наиболее вероятно:", options: ["A) Логика начнёт дублироваться в разных частях системы", "B) Повысится производительность приложения", "C) Упростится проектирование базы данных", "D) Снизится количество зависимостей"], correct: 0 }
    ];

    // ----- Состояние приложения -----
    let examMode = true;                // true - экзамен (удаление), false - тренировка
    let currentQuestions = [];
    let currentIndex = 0;
    let correctCount = 0;              // в экзамене: число удалённых (выученных), в тренировке: число верных ответов
    let totalInitial = 0;

    // DOM-элементы
    const totalCountSpan = document.getElementById('total-count');
    const currentNumSpan = document.getElementById('current-num');
    const totalSpan = document.getElementById('total-questions');
    const correctCounterSpan = document.getElementById('correct-counter');
    const correctProgressSpan = document.getElementById('correct-progress');
    const progressFill = document.getElementById('progress-fill');
    const progressLabel = document.getElementById('progress-label');
    const questionTextDiv = document.getElementById('question-text');
    const optionsContainer = document.getElementById('options-container');
    const feedbackDiv = document.getElementById('feedback-area');
    const nextBtn = document.getElementById('nextButton');
    const resetBtn = document.getElementById('resetButton');
    const finalResultsDiv = document.getElementById('final-results');
    const dynamicContent = document.getElementById('dynamic-content');
    const navContainer = document.getElementById('nav-buttons-container');
    const totalLimitInput = document.getElementById('total-limit');
    const applyConfigBtn = document.getElementById('applyConfigBtn');
    const configToggleBtn = document.getElementById('configToggleBtn');
    const configDropdown = document.getElementById('configDropdown');
    const modeToggleBtn = document.getElementById('modeToggleBtn');
    const modeDescription = document.getElementById('mode-description');
    const footerText = document.getElementById('footer-text');
    const correctStatLabel = document.getElementById('correct-stat-label');

    function getRandomItems(arr, count) {
        const shuffled = [...arr];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled.slice(0, count);
    }

    function updateModeUI() {
        if (examMode) {
            modeToggleBtn.textContent = '📚 Режим: Экзамен';
            modeToggleBtn.classList.add('exam-active');
            modeDescription.textContent = 'Правильный ответ удаляет вопрос • Ошибайся — учись';
            footerText.textContent = '✨ Верный ответ → вопрос исчезает навсегда. Неверный → остаётся для повторной попытки.';
            progressLabel.textContent = '🏆 Выучено:';
            correctStatLabel.textContent = '✅';
        } else {
            modeToggleBtn.textContent = '🔄 Режим: Тренировка';
            modeToggleBtn.classList.remove('exam-active');
            modeDescription.textContent = 'Вопросы не удаляются • Отвечай сколько угодно';
            footerText.textContent = '📝 Вопросы остаются в списке. Правильные ответы не удаляются — учитесь в своём темпе.';
            progressLabel.textContent = '✅ Правильно:';
            correctStatLabel.textContent = '🎯';
        }
    }

    function updateStatsUI() {
        const totalCurr = currentQuestions.length;
        totalCountSpan.innerText = totalCurr;
        totalSpan.innerText = totalCurr;

        correctCounterSpan.innerText = correctCount;
        correctProgressSpan.innerText = correctCount;

        if (currentIndex >= 0 && totalCurr > 0) {
            currentNumSpan.innerText = currentIndex + 1;
        } else if (totalCurr === 0) {
            currentNumSpan.innerText = 0;
        }

        // Прогресс-бар: в экзамене процент выученных от начального, в тренировке скрываем или делаем 0
        if (examMode) {
            const percent = totalInitial > 0 ? (correctCount / totalInitial) * 100 : 0;
            progressFill.style.width = `${percent}%`;
            document.getElementById('progress-area').style.display = 'block';
        } else {
            // В тренировке прогресс-бар не информативен, можно скрыть или обнулить
            progressFill.style.width = '0%';
            document.getElementById('progress-area').style.display = 'block'; // оставим, но с 0%
        }
    }

    function renderNavigation() {
        navContainer.innerHTML = '';
        for (let i = 0; i < currentQuestions.length; i++) {
            const rect = document.createElement('div');
            rect.classList.add('nav-rect');
            if (i === currentIndex) rect.classList.add('active-rect');
            rect.textContent = i + 1;
            rect.addEventListener('click', (function(idx) {
                return () => {
                    if (idx !== currentIndex && idx < currentQuestions.length) {
                        currentIndex = idx;
                        renderCurrentQuestion();
                        renderNavigation();
                    }
                };
            })(i));
            navContainer.appendChild(rect);
        }
        const activeRect = navContainer.querySelector('.active-rect');
        if (activeRect) activeRect.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }

    function showFeedback(message, isError = true) {
        feedbackDiv.style.display = 'block';
        feedbackDiv.innerHTML = `<strong>${isError ? '❌' : '✅'} ${message}</strong>`;
    }

    function clearFeedback() {
        feedbackDiv.style.display = 'none';
        feedbackDiv.innerHTML = '';
    }

    function handleCorrect() {
        correctCount++;
        if (examMode) {
            // Режим экзамена: удаляем вопрос
            currentQuestions.splice(currentIndex, 1);
            updateStatsUI();
            if (currentQuestions.length === 0) {
                finishExam();
                return;
            }
            if (currentIndex >= currentQuestions.length) {
                currentIndex = currentQuestions.length - 1;
            }
            renderCurrentQuestion();
            renderNavigation();
            showFeedback('✅ Верно! Вопрос удалён из билета.', false);
            setTimeout(() => {
                if (feedbackDiv.style.display !== 'none' && feedbackDiv.innerHTML.includes('Верно!')) clearFeedback();
            }, 1800);
        } else {
            // Режим тренировки: вопрос остаётся
            updateStatsUI();
            showFeedback('✅ Верно! Так держать.', false);
            setTimeout(() => {
                if (feedbackDiv.style.display !== 'none' && feedbackDiv.innerHTML.includes('Верно!')) clearFeedback();
            }, 1800);
            // Не переходим автоматически, ждём нажатия "Дальше"
        }
    }

    function handleIncorrect(selectedIdx, correctIdx) {
        const correctLetter = String.fromCharCode(65 + correctIdx);
        showFeedback(`Неверно. Правильный ответ: ${correctLetter}. Попробуйте ещё раз или перейдите к другому вопросу.`, true);
        const options = document.querySelectorAll('.option-item');
        options.forEach((opt, idx) => {
            if (idx === correctIdx) opt.classList.add('correct-feedback');
            if (idx === selectedIdx && idx !== correctIdx) opt.classList.add('wrong-feedback');
        });
        setTimeout(() => {
            options.forEach(opt => opt.classList.remove('correct-feedback', 'wrong-feedback'));
        }, 2000);
    }

    function handleAnswer(selectedIdx) {
        if (currentQuestions.length === 0) return;
        const currentQ = currentQuestions[currentIndex];
        const isCorrect = (selectedIdx === currentQ.correct);
        if (isCorrect) {
            handleCorrect();
        } else {
            handleIncorrect(selectedIdx, currentQ.correct);
        }
    }

    function renderCurrentQuestion() {
        if (currentQuestions.length === 0) {
            if (examMode) finishExam();
            else {
                // В тренировке такого быть не должно, но если список почему-то пуст, пересоздаём
                rebuildExam();
            }
            return;
        }
        clearFeedback();
        const q = currentQuestions[currentIndex];
        questionTextDiv.innerText = q.text;
        optionsContainer.innerHTML = '';
        q.options.forEach((opt, idx) => {
            const div = document.createElement('div');
            div.className = 'option-item';
            div.innerHTML = `<div class="prefix">${String.fromCharCode(65+idx)}</div><div class="option-text">${opt}</div>`;
            div.addEventListener('click', (e) => {
                e.stopPropagation();
                if (currentQuestions.length === 0) return;
                handleAnswer(idx);
            });
            optionsContainer.appendChild(div);
        });
        updateStatsUI();
        renderNavigation();
    }

    function nextQuestion() {
        if (currentQuestions.length === 0) {
            if (examMode) finishExam();
            else rebuildExam(); // тренировка не должна быть пустой, пересоздадим
            return;
        }
        if (currentIndex + 1 < currentQuestions.length) {
            currentIndex++;
        } else {
            // В экзамене это конец списка, но вопросы ещё есть — идём в начало
            currentIndex = 0;
        }
        renderCurrentQuestion();
        clearFeedback();
    }

    function finishExam() {
        dynamicContent.style.display = 'none';
        finalResultsDiv.style.display = 'block';
        const total = totalInitial;
        const percent = total > 0 ? Math.round((correctCount / total) * 100) : 100;
        let gradeMsg = '';
        if (examMode) {
            gradeMsg = percent >= 80 ? '🎉 Отлично! Вы освоили все вопросы!' : (percent >= 60 ? '👍 Хороший результат, повторите оставшиеся' : '📚 Стоит ещё потренироваться');
            if (currentQuestions.length === 0) gradeMsg = '🏆 Блестяще! Все вопросы успешно сданы!';
        } else {
            gradeMsg = `Вы ответили правильно ${correctCount} раз(а).`;
        }
        finalResultsDiv.innerHTML = `
            <div class="result-panel">
                <div class="finish-stats">🏁 ${examMode ? 'Экзамен' : 'Тренировка'} завершена</div>
                <div style="font-size:1rem; margin:10px 0;">✅ ${examMode ? 'Выучено' : 'Правильных ответов'}: ${correctCount} из ${total} (${percent}%)</div>
                <div style="font-weight:500; margin-bottom:12px;">${gradeMsg}</div>
                <button id="restartFinishBtn" class="apply-config" style="margin-top:8px;">🔄 Новый билет</button>
            </div>
        `;
        document.getElementById('restartFinishBtn')?.addEventListener('click', () => rebuildExam());
    }

    function rebuildExam() {
        let qCount = parseInt(totalLimitInput.value);
        if (isNaN(qCount)) qCount = 30;
        qCount = Math.min(75, Math.max(10, qCount));
        const randomQuestions = getRandomItems(fullBank, qCount);
        currentQuestions = randomQuestions.map(q => ({ ...q }));
        totalInitial = currentQuestions.length;
        correctCount = 0;
        currentIndex = 0;
        finalResultsDiv.style.display = 'none';
        dynamicContent.style.display = 'block';
        clearFeedback();
        updateModeUI();        // обновить подписи в зависимости от режима
        renderCurrentQuestion();
        updateStatsUI();
        renderNavigation();
    }

    // Переключение режима
    modeToggleBtn.addEventListener('click', () => {
        examMode = !examMode;
        rebuildExam();        // полный перезапуск с новым режимом
    });

    applyConfigBtn.addEventListener('click', () => {
        configDropdown.classList.remove('open');
        rebuildExam();
    });
    resetBtn.addEventListener('click', () => rebuildExam());
    nextBtn.addEventListener('click', nextQuestion);
    configToggleBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        configDropdown.classList.toggle('open');
    });
    document.addEventListener('click', (e) => {
        if (!configToggleBtn.contains(e.target) && !configDropdown.contains(e.target)) configDropdown.classList.remove('open');
    });

    // Инициализация
    updateModeUI();
    rebuildExam();
</script>
</body>
</html>
